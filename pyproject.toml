[project]
name = "elegoo-robot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.5",
    "opencv-python-headless>=5.1.0.95",
    "platformio>=6.1",
    "pyserial>=3.5",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
elegoo-robot = "elegoo_robot:main"
car-dashboard = "elegoo_robot.dashboard:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
