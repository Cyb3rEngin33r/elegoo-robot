; Firmware for the ESP32-S3 camera module on the Elegoo Smart Robot Car V4.0.
; Joins your home Wi-Fi and bridges the car's serial port to TCP port 2323.
; Pin-finding tools are on TCP port 2324 (see src/main.cpp).
;
; First flash (module in download mode: hold BOOT, tap RST, release BOOT):
;   cd esp32 && pio run -e usb -t upload
; Later updates over Wi-Fi (module on the car, car switched on):
;   read -rs CAR_OTA_PASSWORD && export CAR_OTA_PASSWORD   # type it, nothing shown
;   pio run -e ota -t upload
;
; Elegoo's original firmware is backed up in backup/ (not in git). Restore with:
;   esptool --port /dev/ttyACM0 write-flash 0 backup/elegoo-original-esp32s3-8MB.bin

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; Serial goes to the module's own USB port (USB-Serial/JTAG), which also lets
; future USB uploads reset the chip without pressing buttons.
; The ESP32-S3R8 has 8 MB of in-package octal PSRAM; the camera keeps its
; frame buffers there.
board_build.arduino.memory_type = qio_opi
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM

[env:usb]
upload_port = /dev/ttyACM0

[env:ota]
upload_protocol = espota
upload_port = elegoo-car.local
upload_flags = --auth=${sysenv.CAR_OTA_PASSWORD}
